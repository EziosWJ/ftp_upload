<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}工业数据采集系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar bg-dark text-white" style="width: 250px; min-height: 100vh;">
            <div class="p-3">
                <h5 class="text-center mb-4">
                    <i class="bi bi-gear-fill"></i> 数据采集系统
                </h5>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link text-white {% if active_page == 'dashboard' %}active{% endif %}" href="/">
                            <i class="bi bi-speedometer2"></i> 仪表盘
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white {% if active_page == 'devices' %}active{% endif %}" href="/devices">
                            <i class="bi bi-hdd-rack"></i> 设备管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white {% if active_page == 'schedules' %}active{% endif %}" href="/schedules">
                            <i class="bi bi-clock"></i> 采集计划
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white {% if active_page == 'ftp' %}active{% endif %}" href="/ftp">
                            <i class="bi bi-cloud-upload"></i> FTP配置
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white {% if active_page == 'logs' %}active{% endif %}" href="/logs">
                            <i class="bi bi-journal-text"></i> 系统日志
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <div class="flex-grow-1">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container-fluid">
                    <span class="navbar-brand">{% block page_title %}{% endblock %}</span>
                </div>
            </nav>

            <div class="container-fluid p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Shared error formatting — converts Pydantic 422 detail arrays to readable strings
    function formatError(detail) {
        if (!detail) return '未知错误';
        if (typeof detail === 'string') return detail;
        if (Array.isArray(detail)) {
            return detail.map(e => {
                const loc = (e.loc || []).join(' → ');
                const msg = e.msg || JSON.stringify(e);
                return loc ? `${loc}: ${msg}` : msg;
            }).join('\n');
        }
        if (typeof detail === 'object') return JSON.stringify(detail);
        return String(detail);
    }

    function showMessage(message, type) {
        const container = document.getElementById('message-container');
        if (!container) return;
        const alert = document.createElement('div');
        alert.className = `alert alert-${type} alert-dismissible fade show`;
        alert.style.whiteSpace = 'pre-line';
        alert.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        container.appendChild(alert);
        setTimeout(() => alert.remove(), 5000);
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
